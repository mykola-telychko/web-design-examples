<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>Paper Color Palette</title>

<style>
body{
    background:#2b2b2b;
    font-family:Arial,sans-serif;
    padding:40px;
}

.palette{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
    gap:20px;
}

.color{
    height:140px;
    border-radius:10px;
    border:1px solid #c9c9c9;
    box-shadow:0 2px 8px rgba(0,0,0,.15);
    display:flex;
    flex-direction:column;
    justify-content:flex-end;
    padding:15px;
    box-sizing:border-box;
    color:#4b4035;
    font-weight:bold;
}

.code{
    font-size:14px;
    opacity:.8;
}
</style>
</head>

<body>

<div class="palette">

<div class="color" style="background:#FFFDF8;">
    Milk Paper
    <div class="code">#FFFDF8</div>
</div>

<div class="color" style="background:#FCF9F0;">
    Soft Ivory
    <div class="code">#FCF9F0</div>
</div>

<div class="color" style="background:#FDF5E6;">
    Old Lace
    <div class="code">#FDF5E6</div>
</div>

<div class="color" style="background:#FAF0E6;">
    Linen
    <div class="code">#FAF0E6</div>
</div>

<div class="color" style="background:#F8F3E5;">
    Cream Paper
    <div class="code">#F8F3E5</div>
</div>

<div class="color" style="background:#F5F5DC;">
    Beige
    <div class="code">#F5F5DC</div>
</div>

<div class="color" style="background:#F7F0DD;">
    Book Page
    <div class="code">#F7F0DD</div>
</div>

<div class="color" style="background:#F5EFD9;">
    Warm Paper
    <div class="code">#F5EFD9</div>
</div>

<div class="color" style="background:#F2EBD7;">
    Antique Paper
    <div class="code">#F2EBD7</div>
</div>

<div class="color" style="background:#F1E9D2;">
    Parchment
    <div class="code">#F1E9D2</div>
</div>

<div class="color" style="background:#EFE5D0;">
    Vintage Book
    <div class="code">#EFE5D0</div>
</div>

<div class="color" style="background:#EBE0C8;">
    Old Archive
    <div class="code">#EBE0C8</div>
</div>

<div class="color" style="background:#E8DCC4;">
    Aged Paper
    <div class="code">#E8DCC4</div>
</div>

<div class="color" style="background:#E3D2B1;">
    Yellowed Paper
    <div class="code">#E3D2B1</div>
</div>

<div class="color" style="background:#DDC998;">
    Dark Parchment
    <div class="code">#DDC998</div>
</div>

</div>

</body>
</html>
